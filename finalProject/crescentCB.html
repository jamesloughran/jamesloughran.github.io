<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescent CookBook</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <style>
        .navbar-gradient{
            background: linear-gradient(90deg, grey 0%, white 70%);

        }
        .card-img-top{
            height: 200px;
            object-fit: cover;
        }
        .box-background{
            background: linear-gradient(90deg, silver 0%, white 70%);
            color: white;
            padding: 30px;
            border-color: gold;

        }

        .btn-search{
            background: linear-gradient(90deg, white 0%, silver 70%);
            border-color: grey;
            color: black;
            font-weight: bold;
        }

        .btn-search:hover{
            background-color: grey;
            border-color: white;
            color: white;
        }

        .btn-random{
            background: linear-gradient(90deg, black 0%, gold 70%);
            border-color: grey;
            color: black;
            font-weight: bold;
        }

        .btn-random:hover{
            background-color: grey;
            border-color: white;
            color: white;
        }

    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark navbar-gradient">
        <div class="container">
            <a class="navbar-brand" href="crescentCB.html">CRESCENT COOKBOOK</a>
        </div>

    </nav>


        <div class="container-fluid p-0 mb-5">
            <div class="row g-0 align-items-stretch" style="min-height: 450px;">

                <div class="col-md-6 shadow-lg d-flex flex-column justify-content-center p-5 text-white mb-4 mb-md-0"
                    style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(https://simplykanso.com/cdn/shop/files/Sef85626ce4804f598b2ee6f8e597dc6ct.webp?v=1745766175); background-size: cover; background-position: center;">

                    <h1 class="display-4 fw-bold">CRESCENT COOKBOOK</h1>
                    <p>Search By Name Or By category, Or Try The "Random" Button</p>

                </div>

                <div class="col-md-6 d-flex flex-column justify-content-center px-5 py-4" style="background: whitesmoke;">

                        
                        <div class="col-md-12 p-3">
                            <input type="text" id="searchInput" class="form-control form-control-lg " placeholder="Curry, Japan,...etc">
                        </div>

                        <div class="col-md-12 p-3">
                            <select id="categorySelect" class="form-select form-select-lg" onchange="handleCat(this.value)">
                                <option value="">Select from category</option>
                                <option value="Beef">Beef</option>
                                <option value="Chicken">Chicken</option>
                                <option value="Pork">Pork</option>
                                <option value="Lamb">Lamb</option>
                                <option value="Seafood">Seafood</option>
                                <option value="Pasta">Pasta</option>
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Vegan">Vegan</option>
                                <option value="Breakfast">Breakfast</option>
                                <option value="Dessert">Dessert</option>
                            </select>
                        </div>

                        
                        <div class="col-md-12 d-flex flex-column align-items-center">
                            <div class="d-flex flex-column gap-2 w-100 align-items-center">
                                <button onclick="handleSearch()" class="btn btn-search btn-lg w-50">Search</button>
                                <button onclick="handleRandom()" class="btn btn-random btn-lg w-50">Random</button>
                            </div>
                        </div>

                </div>
            </div>
        </div>
        <hr>

        <div class="container">
            <div id="resultsWrapper">
                <div id="mealContainer" class="row">
                    <div class="col-12 text-center">
                        <p>Lets See Your Results</p>
                    </div>

                </div>
            </div>
        </div>

    <script>

        const mealContainer = document.getElementById('mealContainer');
        const resultsWrapper = document.getElementById('resultsWrapper');

        // GET the meals from the API
        async function getMeals(url){
            
            try{
                const response = await fetch(url, {
                    method: 'GET'
                });

                const data = await response.json();
                renderMeals(data.meals);
            }catch(error){
                console.log("FETCH ERROR:", error);
                mealContainer.innerHTML = '<p class="text-danger text-center">ERROR connecting to API</p>';

            }
        }

        // function to get the wanted foods and display them on cards
        function renderMeals(meals){
            mealContainer.innerHTML = '';
            if(!meals){
                resultsWrapper.classList.remove('card','box-background');
                mealContainer.innerHTML = '<div class="col-12" text-center text-warning><h3>No Results Found.</h3></div>';
                return;
            }

            resultsWrapper.classList.add('card','box-background');

            meals.forEach(meal => {
                const mealHTML = `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <img src="${meal.strMealThumb}" class="card-img-top" alt="${meal.strMeal}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold">${meal.strMeal}</h5>
                            <a href="detail.html?id=${meal.idMeal}" class="btn btn-outline-danger mt-auto">Get Recipe</a>
                        </div>
                    </div>    
                </div>`;
                mealContainer.insertAdjacentHTML('beforeend', mealHTML);
            });
        }

        // function for the search button
        async function handleSearch(){
            
            const searchWord = document.getElementById('searchInput').value.trim();
            if(searchWord == "") return; // if we have no input, do nothing

            // filter for Area where the food is from/nationality
            const areaUrl = `https://www.themealdb.com/api/json/v1/1/filter.php?a=${searchWord}`;

            try{
                const response = await fetch(areaUrl, {
                    method: 'GET'
                });
                const data = await response.json();

                if(data.meals){
                    renderMeals(data.meals); // show the data
                }else{
                    getMeals(`https://www.themealdb.com/api/json/v1/1/search.php?s=${searchWord}`); // if not then the meal name
                }
            }catch(error){
                console.error("Search ERROR:", error);
            }
        }

        // function for random button
        async function handleRandom(){
            const random = `https://www.themealdb.com/api/json/v1/1/random.php`;

            try{
                const response = await fetch(random, {
                    method: 'GET'
                });
                const data = await response.json();

                if(data.meals){ // get random id and go to details page showing the recipe
                    const mealId = data.meals[0].idMeal;
                    window.location.href = `detail.html?id=${mealId}`
                }
            }catch (error){
                console.error("Random ERROR:", error);
            }
        }

        // function category dropdown
        function handleCat(categoryName){
            if(categoryName !== ""){
                getMeals(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${categoryName}`);
            } // once clicked filters meals from the Api's category
        }
    </script>
</body>
</html>
